<!doctype html>
<html lang="ckb" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>پۆرتاڵی کڕیار • هەژمارەکانم</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script>
      // Redirect to main SPA with ?t= parameter if loaded as customer.html
      const params = new URLSearchParams(window.location.search);
      const token = params.get('t');
      if (token) {
        window.location.replace('./index.html?t=' + encodeURIComponent(token));
      } else {
        window.location.replace('./index.html');
      }
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen">
    <p class="text-sm font-bold text-slate-400">دەچێتە ناو پۆرتاڵ...</p>
  </body>
</html>
